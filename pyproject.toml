[project]
name = "rl-iceslider"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gymnasium==0.29.1",
    "imageio==2.35.1",
    "imageio-ffmpeg==0.5.1",
    "matplotlib==3.9.2",
    "networkx>=3.0",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "puzzlegen",
    "scikit-learn>=1.3.0",
    "stable-baselines3>=2.2.1",
    "tensorboard==2.17.1",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.workspace]
members = [
    "puzzlegen",
]

[tool.uv.sources]
puzzlegen = { workspace = true, editable = true }
